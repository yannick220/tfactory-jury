<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020614"><title>T·Factory • Jury</title><link rel="manifest" href="manifest.webmanifest"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{background:#020614;color:#f5f7ff;font:16px/1.5 Montserrat,system-ui,sans-serif;margin:0}header{padding:18px 24px;border-bottom:1px solid #304477;display:flex;justify-content:space-between;align-items:center}main{max-width:850px;margin:25px auto;padding:0 16px}.card{background:#0b1430;border:1px solid #304477;border-radius:20px;padding:22px;margin:14px 0}h1{font-size:32px}h2{margin:0 0 12px}label{display:block;font-weight:700;margin:12px 0 5px}input,textarea{width:100%;border:1px solid #455578;background:#0e1730;color:white;padding:12px;border-radius:10px;font:inherit}textarea{min-height:80px}.btn{display:inline-block;border:1px solid #455578;background:#273452;color:white;border-radius:12px;padding:12px 17px;font-weight:750;cursor:pointer;text-decoration:none}.primary{background:#ffcf38;color:#10152a;border-color:#ffcf38}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#b9c6df}.status{color:#ffcf38;min-height:22px}.hidden{display:none}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet"></head><body><header><strong>T<span style="color:#ffcf38">·</span>FACTORY — JURY</strong><a class="btn" href="./index.html">⌂ Home</a></header><main><section id="gate" class="card"><h1>Accès jury</h1><p class="muted">Saisis le code individuel à cinq chiffres transmis par l'administrateur.</p><label>Code à 5 chiffres</label><input id="code" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" placeholder="00000" autocomplete="off"><p id="gateStatus" class="status"></p><button class="btn primary" onclick="connect()">Accéder aux évaluations</button></section><section id="work" class="hidden"><div class="card"><h1 id="identity"></h1><p class="muted" id="pitchName"></p><button class="btn" onclick="disconnect()">Changer de code</button></div><div id="teams"></div></section></main><script src="./tfactory-config.js"></script><script>
const names=['Love money','Subventions','Conseil d’administration','Crowdfunding','Communication','Emprunt bancaire','Recrutement','Capital-risque'];let accessCode='',data=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function action(action,extra={}){return tfRequest('/rest/v1/rpc/tfactory_v18_jury_action',{method:'POST',body:JSON.stringify({p_code:accessCode,p_action:action,...extra})})}
async function connect(){let v=document.getElementById('code').value.trim();if(!/^\d{5}$/.test(v)){document.getElementById('gateStatus').textContent='Saisis exactement cinq chiffres.';return}accessCode=v;try{await refresh()}catch(e){document.getElementById('gateStatus').textContent='Code refusé ou accès indisponible. '+e.message;accessCode=''}}
function autoFunding(n){if(!Number.isFinite(n))return 0;/* Normalize only the final weighted score: legacy converted grades can differ by tiny fractions. */const score=Math.max(0,Math.min(20,Math.round((n+Number.EPSILON)*100)/100));const bands=[[0,4,0,500],[4,8,500,1000],[8,12,1000,2000],[12,16,2000,4000],[16,20,4000,8000]];const b=bands.find((x,i)=>score>=x[0]&&(score<x[1]||i===bands.length-1))||bands[4];const raw=b[2]+(score-b[0])*(b[3]-b[2])/(b[1]-b[0]);return Math.max(0,Math.min(8000,Math.round(raw)))}
const euros=n=>Number(n).toLocaleString('fr-FR')+' €';
function toTen(v,max){return Number((Number(v)*10/max).toFixed(2))}
function fromTen(v,max){return Number((Number(v)*max/10).toFixed(6))}
function validNote(el){const n=Number(el.value);return el.value.trim()!==''&&Number.isFinite(n)&&n>=0&&n<=10}
function updateBand(i){const f=document.getElementById('f'+i),m=document.getElementById('m'+i),hint=document.getElementById('band'+i);if(!validNote(f)||!validNote(m)){hint.textContent='Renseigne le fond et la forme pour calculer le financement.';return}const limits=data.category==='pro'?[8,12]:[12,8];const n=fromTen(+f.value,limits[0])+fromTen(+m.value,limits[1]);hint.textContent='Note générale : '+n.toLocaleString('fr-FR',{maximumFractionDigits:2})+'/20 · Financement automatique : '+euros(autoFunding(n))}
async function refresh(){data=await action('info');document.getElementById('gate').classList.add('hidden');document.getElementById('work').classList.remove('hidden');document.getElementById('identity').textContent=data.name+' · '+(data.category==='pro'?'Jury professionnel':'Jury pédagogique');document.getElementById('pitchName').textContent='P'+(data.pitch+1)+' — '+names[data.pitch];let limits=data.category==='pro'?[8,12]:[12,8];document.getElementById('teams').innerHTML=data.teams.map(t=>`<div class="card"><h2>${esc(t.name)}</h2><p class="muted">${esc(t.activity||'')}</p><div class="grid"><div><label>Fond /10</label><input type="number" id="f${t.index}" oninput="updateBand(${t.index})" min="0" max="10" step="any" value="${t.entry?.fond!=null?toTen(t.entry.fond,limits[0]):''}"></div><div><label>Forme /10</label><input type="number" id="m${t.index}" oninput="updateBand(${t.index})" min="0" max="10" step="any" value="${t.entry?.forme!=null?toTen(t.entry.forme,limits[1]):''}"></div></div><label>Financement calculé (€)</label><p class="muted" id="band${t.index}" aria-live="polite">Renseigne les notes pour connaître la fourchette autorisée.</p><label>Commentaire facultatif</label><textarea id="c${t.index}" maxlength="2000">${esc(t.entry?.comment||'')}</textarea><p class="status" id="s${t.index}">${t.entry?'Évaluation enregistrée':''}</p><button class="btn primary" onclick="saveTeam(${t.index})">Enregistrer cette équipe</button></div>`).join('');data.teams.forEach(t=>updateBand(t.index))}
async function saveTeam(i){const st=document.getElementById('s'+i),f=document.getElementById('f'+i),m=document.getElementById('m'+i),limits=data.category==='pro'?[8,12]:[12,8];if(!validNote(f)||!validNote(m)){st.textContent='Saisis deux notes valides entre 0 et 10.';return}const fond=fromTen(+f.value,limits[0]),forme=fromTen(+m.value,limits[1]),amount=autoFunding(fond+forme);st.textContent='Enregistrement…';try{await action('save',{p_team:i,p_fond:fond,p_forme:forme,p_amount:amount,p_comment:document.getElementById('c'+i).value});st.textContent='Enregistré dans Supabase ✓'}catch(e){st.textContent='Erreur : '+e.message}}
function disconnect(){accessCode='';data=null;document.getElementById('code').value='';document.getElementById('gate').classList.remove('hidden');document.getElementById('work').classList.add('hidden')}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
