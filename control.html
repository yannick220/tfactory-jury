historique du tableur."},{"scores":[5.75,9,9,6.5],"amount":3500,"locked":true,"historicalValuation":11245.93,"comment":"Résultat historique du tableur."},null,null,null,null,null,null]}];const TITLES=['Love money','Subventions','Conseil d’administration','Crowdfunding','Communication','Emprunt bancaire','Recrutement','Capital-risque'];const COLORS=['#ffcf38','#60b9ff','#ff7f65','#bb9aff','#69d4c5','#ff8fca'];let state;let tab='classement',pitch=2,team=0,hidden=new Set();const fmt=v=>Number(v).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';const noteFmt=v=>Number(v).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){return {teams:structuredClone(INITIAL)}}
let remoteStamp=null,tfToken=null,tfQueue=Promise.resolve(),tfReady=false;
function save(){render();return persistState()}
function persistState(){
 if(!tfReady||!tfToken){const err=new Error('Session administrateur non connectée.');alert(err.message);return Promise.reject(err)}
 const snapshot=JSON.stringify(state);
 // Une erreur réseau ne doit jamais bloquer les clics ni les sauvegardes suivantes.
 const operation=tfQueue.catch(()=>{}).then(async()=>{
  const updated=await tfRequest('/rest/v1/tfactory_v18_state?id=eq.1&updated_at=eq.'+encodeURIComponent(remoteStamp),{
   method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({data:JSON.parse(snapshot)})
  },tfToken);
  if(!updated?.length)throw new Error('Les données ont changé sur un autre appareil. Recharge la page pour récupérer la version Supabase.');
  remoteStamp=updated[0].updated_at;
 });
 tfQueue=operation.catch(err=>{
  // Garder tfReady=true : sinon render() cesse de fonctionner et tous les boutons semblent morts.
  console.error('Sauvegarde T·Factory échouée',err);
  alert('Sauvegarde Supabase impossible : '+err.message+'\nLes changements ne sont pas confirmés.');
 });

state=load();
function autoFunding(n){if(!Number.isFinite(n))return 0;return Math.max(0,Math.min(20,n))*300}function amountOf(e){if(!e?.locked)return 0;const raw=[...(e.proJurors||[]),...(e.pedJurors||[])];if(raw.length){const values=raw.map(r=>autoFunding(Number(r[0])+Number(r[1])));return Math.ceil((values.reduce((a,b)=>a+b,0)/values.length-1e-9)/10)*10}const a=e.juryAmounts;if(Array.isArray(a)&&a.length){const vals=a.map(x=>Number(x.amount)).filter(Number.isFinite);if(vals.length)return Math.ceil((vals.reduce((s,v)=>s+v,0)/vals.length-1e-9)/10)*10}return Math.ceil((autoFunding(score(e))-1e-9)/10)*10}function toTen(v,max){return Number((Number(v)*10/max).toFixed(6))}function fromTen(v,max){return Number(v)*max/10}function score(e){return .7*(e.scores[0]+e.scores[1])+.3*(e.scores[2]+e.scores[3])}function band(v){return [0,6000,'Financement proportionnel']}function eligible(p){return state.teams.filter(t=>(t.joinedAt??0)<=p)}function available(p){let ts=eligible(p);return ts.length>0&&ts.every(t=>t.pitches[p]?.locked)}function combin(t,p){let n=t.pitches.map(x=>x?.locked?score(x):null);if(n[p]==null)return null;let avg=a=>{let v=a.map(i=>n[i]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};let P=avg([0,1,3]),J=n[2],M=n[4],F=avg([5,7]),H=n[6];if(p<2)return P;if(p<4)return P*.875+(J??0)*.125;if(p===4)return P*.5834+(J??0)*.0833+(M??0)*.3333;if(p===5)return P*.3684+(J??0)*.0526+(M??0)*.2106+(F??0)*.3684;return P*.35+(J??0)*.05+(M??0)*.2+(F??0)*.35+(H??0)*.05}function valuation(i,p){let t=state.teams[i],e=t.pitches[p];if(!e?.locked||!available(p))return null;let C=t.pitches.slice(0,p+1).reduce((a,x,j)=>a+(x?.locked&&j!==5?amountOf(x):0),0);let N=combin(t,p),cohort=eligible(p).filter(x=>combin(x,p)!=null),mu=cohort.length?cohort.reduce((a,x)=>a+combin(x,p),0)/cohort.length:0;return mu?Math.max(0,C*(1+((N-mu)/mu)*1.3*7.5)):null}function last(){let k=-1;for(let p=0;p<8;p++){if(available(p))k=p;else break}return k}function nav(){return '<div class="tabs">'+[['classement','Classement · valorisation'],['courbes','Évolution'],['notes','Notes & financements']].map(([id,t])=>`<button class="btn ${tab===id?'active':''}" onclick="tab='${id}';render()">${t}</button>`).join('')+'</div>'}function ranking(p){let arr=state.teams.map((t,i)=>({t,i,v:valuation(i,p)})).sort((a,b)=>(b.v??-Infinity)-(a.v??-Infinity));return '<div class="small muted" style="margin:10px 0 14px">Classement par valorisation · Note thématique comparée à la moyenne des équipes · K = 1,3 · M = 7,5</div><div class="card">'+arr.map((x,j)=>`<div class="rank"><div class="bigRank">${j+1}</div><div style="flex:1"><b>${esc(x.t.name)}</b><div class="small muted">${esc(x.t.activity)}</div></div><div class="score" style="font-size:clamp(18px,2.5vw,27px)">${x.v==null?'En attente':fmt(x.v)}</div></div>`).join('')+'</div>'}function chart(){let values=state.teams.flatMap((t,i)=>t.pitches.map((_,p)=>valuation(i,p))).filter(v=>v!=null),min=Math.min(0,...values),max=Math.max(1000,...values),W=1050,H=380,L=75,R=25,T=30,B=50,xx=p=>L+p*(W-L-R)/7,yy=v=>T+(max-v)*(H-T-B)/(max-min||1);let lines='';for(let j=0;j<=4;j++){let v=min+(max-min)*j/4,y=yy(v);lines+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#34445e" stroke-dasharray="5 8"/><text x="${L-9}" y="${y+5}" fill="#c1cce0" text-anchor="end" font-size="16">${Math.round(v/1000)}k</text>`}for(let p=0;p<8;p++)lines+=`<text x="${xx(p)}" y="${H-15}" fill="#c1cce0" text-anchor="middle" font-size="17">P${p+1}</text>`;state.teams.forEach((t,i)=>{if(hidden.has(i))return;let points=[];for(let p=0;p<8;p++){let v=valuation(i,p);if(v==null)break;points.push([xx(p),yy(v)])}if(points.length){lines+=`<polyline points="${points.map(v=>v.join(',')).join(' ')}" fill="none" stroke="${COLORS[i]}" stroke-width="5" stroke-linejoin="round"/>`;for(let [x,y] of points)lines+=`<circle cx="${x}" cy="${y}" r="6" fill="${COLORS[i]}" stroke="#101a30" stroke-width="3"/>`}});return `<div class="card"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbes des valorisations">${lines}</svg><div class="legend">${state.teams.map((t,i)=>`<button class="${hidden.has(i)?'off':''}" onclick="hidden.has(${i})?hidden.delete(${i}):hidden.add(${i});render()"><span style="color:${COLORS[i]}">●</span> ${esc(t.name)}</button>`).join('')}</div></div>`}function noteTable(){let p=+pitch;return '<div class="grid">'+state.teams.map((t,i)=>{let e=t.pitches[p];return `<div class="card"><h3>${esc(t.name)}</h3>${e?.locked?`<div class="stat">${noteFmt(score(e))}<span class="muted" style="font-size:18px"> /20</span></div><div class="small muted">${band(score(e))[2]} · Financement ${fmt(amountOf(e))}</div><div style="margin-top:12px">${esc(e.comment||'Aucun commentaire')}</div>`:'<div class="muted">En attente de saisie et de validation</div>'}</div>`}).join('')+'</div>'}function results(){let p=last();return `<span class="pill">Saison en cours · Pitch ${Math.max(1,p+1)}/8</span><h1>La course à la valorisation.</h1><p class="muted">Classements recalculés à partir des évaluations validées. Les financements sont calculés automatiquement à partir des notes conservées.</p>${nav()}${tab==='classement'?ranking(Math.max(0,p)):tab==='courbes'?chart():`<div class="actions">${TITLES.map((t,i)=>`<button class="btn ${pitch===i?'active':''}" onclick="pitch=${i};render()">P${i+1}</button>`).join('')}</div><h2>Pitch ${pitch+1} — ${TITLES[pitch]}</h2>${noteTable()}`}`;}

let view='jurys',proCount=2,pedCount=1;let juryPitch=-1;
function admin(){if(juryPitch!==pitch){let c=state.juryConfig?.[pitch];proCount=c?.pro?.length??2;pedCount=c?.ped?.length??1;juryPitch=pitch}let e=state.teams[team].pitches[pitch],locked=e?.locked;return `<h1>${view==='saisie'?'Saisir les notes':view==='resultats'?'Résultats':view==='jurys'?'Jurés et validation':'Équipes'}</h1><div class="tabs">${[['jurys','Jurés & validations'],['saisie','Corrections manuelles'],['resultats','Résultats']].map(([id,t])=>`<button class="btn ${view===id?'active':''}" onclick="view='${id}';render()">${t}</button>`).join('')}<button class="btn ${view==='equipes'?'active':''}" onclick="view='equipes';render()">Gérer les équipes</button></div>${view==='resultats'?results():view==='equipes'?teamManager():view==='jurys'?juryAdmin():form(e,locked)}`}
function teamManager(){return `<div class="card"><h2>Gérer les équipes</h2><p class="muted">Le nom et le cœur de métier sont mis à jour dans toute l’application.</p>${state.teams.map((t,i)=>`<div class="teamEdit"><div class="row"><h3>Équipe ${i+1}</h3><button class="btn danger" onclick="removeTeam(${i})">Supprimer</button></div><label>Nom de l’équipe</label><input id="teamname${i}" value="${esc(t.name)}"><label>Cœur de métier</label><input id="teamactivity${i}" value="${esc(t.activity||'')}"></div>`).join('')}<div class="actions"><button class="btn primary" id="saveTeamsButton" onclick="updateTeams()">Enregistrer les modifications</button><button class="btn" onclick="addTeam()">+ Ajouter une équipe</button></div><p class="muted small">Une équipe ajoutée commence au prochain pitch non publié, sans résultats antérieurs. Une équipe supprimée disparaît de tous les écrans ; cette suppression est définitive sur cet appareil.</p></div>`}
async function updateTeams(){
 const btn=document.getElementById('saveTeamsButton');
 if(btn?.disabled)return false;
 const edits=state.teams.map((t,i)=>({name:document.getElementById('teamname'+i)?.value.trim(),activity:document.getElementById('teamactivity'+i)?.value.trim()}));
 if(edits.some(x=>!x.name)){alert('Chaque équipe doit avoir un nom.');return false}
 const previous=structuredClone(state.teams);
 edits.forEach((x,i)=>{state.teams[i].name=x.name;state.teams[i].activity=x.activity??''});
 if(btn){btn.disabled=true;btn.textContent='Enregistrement…'}
 try{await persistState();render();notify();alert('Modifications des équipes enregistrées dans Supabase.');return true}
 catch(err){state.teams=previous;if(btn){btn.disabled=false;btn.textContent='Enregistrer les modifications'}return false}
}
async function addTeam(){
 if(!(await updateTeams()))return;
 const name=prompt('Nom de la nouvelle équipe :');if(!name?.trim())return;
 const activity=prompt('Cœur de métier (facultatif) :')||'';
 const previous=structuredClone(state.teams);
 const joinedAt=Math.min(7,Math.max(0,last()+1));
 state.teams.push({name:name.trim(),activity:activity.trim(),joinedAt,pitches:Array(8).fill(null)});
 try{await persistState();team=state.teams.length-1;render();notify()}
 catch{state.teams=previous;render()}
}
async function removeTeam(i){
 if(state.teams.length<=1){alert('Il faut conserver au moins une équipe.');return}
 if(!confirm(`Supprimer définitivement « ${state.teams[i].name} » et ses résultats de cette application ?`))return;
 const previous=structuredClone(state.teams);
 state.teams.splice(i,1);
 try{await persistState();team=Math.min(team,state.teams.length-1);render();notify()}
 catch{state.teams=previous;render()}
}
function juryNames(kind,count){return Array.from({length:count},(_,j)=>document.getElementById(`${kind}_name_${j}`)?.value.trim()||'').filter((_,i)=>i<count)}
function storeJuryConfig(){state.juryConfig??=Array.from({length:8},()=>null);state.juryConfig[pitch]={pro:juryNames('pro',proCount),ped:juryNames('ped',pedCount)};persistState()}

function form(e,locked){
const names=['Fond','Forme'];
const rows=(kind,count,maxes,existing)=>`<div class="card"><div class="row"><div><h2>${kind==='pro'?'Jurys professionnels':'Jurys pédagogiques'}</h2><p class="muted small">Fond /10 · Forme /10</p></div><div class="row"><button class="btn" onclick="changeCount('${kind}',-1)">−</button><b>${count}</b><button class="btn" onclick="changeCount('${kind}',1)">+</button></div></div>${Array.from({length:count},(_,j)=>`<div class="formGrid" style="border-top:1px solid var(--edge);padding-top:12px;margin-top:12px"><div style="grid-column:1/-1"><label>Prénom du juré ${j+1}</label><input id="${kind}_name_${j}" placeholder="Prénom" value="${esc(state.juryConfig?.[pitch]?.[kind]?.[j]??'')}"></div>${names.map((name,k)=>`<div><label>${name} /10</label><input type="number" inputmode="decimal" step="0.25" min="0" max="10" id="${kind}_${j}_${k}" value="${existing?.[j]?.[k]!=null?toTen(existing[j][k],maxes[k]):e?.scores?.[kind==='pro'?k:k+2]!=null?toTen(e.scores[kind==='pro'?k:k+2],maxes[k]):''}"></div>`).join('')}</div>`).join('')}</div>`;
return `<div class="card"><h2>1. Pitch et équipe</h2><div class="pitchChoices">${TITLES.map((t,i)=>`<button class="btn ${pitch===i?'active':''}" onclick="storeJuryConfig();pitch=${i};calculated=null;render()"><b>P${i+1}</b><small>${esc(t)}</small></button>`).join('')}</div><select onchange="team=+this.value;calculated=null;render()">${state.teams.map((t,i)=>`<option value="${i}" ${team===i?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><h2 style="margin-top:24px">2. Composition des jurys</h2><div class="grid">${rows('pro',proCount,[8,12],e?.proJurors)}${rows('ped',pedCount,[12,8],e?.pedJurors)}</div><div class="card" style="margin-top:15px"><div class="row"><b>Total : ${proCount+pedCount} jurés</b><span class="pill">70 % pro · 30 % pédagogique</span></div><div class="actions"><button class="btn primary" onclick="calculate()">Calculer les moyennes</button></div><div id="computed" class="notice">Saisis les notes de chaque juré puis calcule les moyennes.</div></div><div class="card" style="margin-top:15px"><h2>3. Financement et validation</h2><label>Financement automatique</label><div class="row"><span id="amountLimits" class="muted">Calculer les notes pour obtenir le financement</span><strong id="amountValue">${e?.locked?fmt(amountOf(e)):'—'}</strong></div><label>Commentaire facultatif</label><textarea id="comment">${esc(e?.comment??'')}</textarea><div class="actions"><button class="btn primary" onclick="validatePitch()">Valider cette équipe</button>${locked?'<button class="btn danger" onclick="unlockPitch()">Corriger cette évaluation</button>':''}</div><p class="small muted">Une évaluation déjà validée peut être corrigée : les résultats publiés et les valorisations sont recalculés après nouvelle validation.</p></div><div class="card" style="margin-top:15px"><h2>4. Administration du pitch</h2><p class="muted">Réinitialiser P${pitch+1} efface aussi tous les jurés et leurs codes, ainsi que les évaluations, financements et commentaires de ce pitch, mais conserve les autres pitchs. Le Live cessera de publier ce pitch tant que toutes les équipes ne seront pas revalidées.</p><div class="actions"><button class="btn" onclick="exportJSON()">Sauvegarder les données (JSON)</button><button class="btn danger" onclick="resetSelectedPitch()">Réinitialiser entièrement P${pitch+1}</button></div></div>`}
let calculated=null;
function changeCount(kind,delta){let inputs={};document.querySelectorAll('input[id^="pro_"],input[id^="ped_"]').forEach(el=>inputs[el.id]=el.value);if(kind==='pro')proCount=Math.max(0,Math.min(10,proCount+delta));else pedCount=Math.max(0,Math.min(10,pedCount+delta));calculated=null;render();for(const [id,value] of Object.entries(inputs)){let el=document.getElementById(id);if(el)el.value=value}}
function calculate(){if(proCount<1||pedCount<1){alert('Il faut au moins un jury professionnel et un jury pédagogique pour appliquer la pondération 70/30.');return false}let read=(kind,count,maxes)=>{let result=[];for(let j=0;j<count;j++){let row=[];for(let k=0;k<2;k++){let el=document.getElementById(`${kind}_${j}_${k}`),v=el.value.trim()===''?NaN:+el.value;if(!Number.isFinite(v)||v<0||v>maxes[k])throw Error(`${kind==='pro'?'Professionnel':'Pédagogique'} ${j+1} — ${k===0?'Fond':'Forme'} : valeur entre 0 et ${maxes[k]}.`);row.push(v)}result.push(row)}return result};let pro,ped;try{pro=read('pro',proCount,[10,10]).map(r=>r.map((v,k)=>fromTen(v,[8,12][k])));ped=read('ped',pedCount,[10,10]).map(r=>r.map((v,k)=>fromTen(v,[12,8][k])))}catch(e){alert(e.message);calculated=null;return false}let avg=(arr,k)=>arr.reduce((a,r)=>a+r[k],0)/arr.length;let scores=[avg(pro,0),avg(pro,1),avg(ped,0),avg(ped,1)];let fond=.7*scores[0]+.3*scores[2],forme=.7*scores[1]+.3*scores[3],n=fond+forme;let [min,max,level]=band(n);storeJuryConfig();calculated={scores,proJurors:pro,pedJurors:ped};let jurors=[...pro,...ped];let exactMean=jurors.reduce((a,r)=>a+autoFunding(r[0]+r[1]),0)/jurors.length;document.getElementById('amountValue').textContent=fmt(Math.ceil((exactMean-1e-9)/10)*10);document.getElementById('amountLimits').textContent='Moyenne des financements des jurés · dizaine supérieure';document.getElementById('computed').innerHTML=`<div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));text-align:center"><div><div class="small muted">Fond</div><b>${noteFmt(fond)}/9,2</b></div><div><div class="small muted">Forme</div><b>${noteFmt(forme)}/10,8</b></div><div><div class="small muted">Générale</div><b class="good">${noteFmt(n)}/20</b></div></div><p class="small muted">${level} · Professionnels : ${pro.length} · Pédagogiques : ${ped.length}</p>`;return true}
function validatePitch(){if(pitch<(state.teams[team].joinedAt??0)){alert('Cette équipe a rejoint la compétition après ce pitch.');return}if(!calculate())return;let n=score(calculated),jurors=[...(calculated.proJurors||[]),...(calculated.pedJurors||[])];let juryAmounts=jurors.map((r,i)=>({name:'Juré '+(i+1),amount:autoFunding(r[0]+r[1])}));let amount=Math.ceil((juryAmounts.reduce((a,x)=>a+x.amount,0)/juryAmounts.length-1e-9)/10)*10;if(!confirm('Valider cette évaluation ?'))return;state.teams[team].pitches[pitch]={...calculated,juryAmounts,amount,locked:true,comment:document.getElementById('comment').value};calculated=null;save();notify()}
function unlockPitch(){if(!confirm('Modifier cette évaluation déjà validée ? Les changements ne seront enregistrés qu’après une nouvelle validation.'))return;alert('Tu peux modifier les notes et le commentaire, puis cliquer sur « Valider cette équipe ».');}
async function resetSelectedPitch(){
 const p=pitch;
 if(!confirm(`Réinitialiser entièrement le pitch P${p+1} — ${TITLES[p]} pour TOUTES les équipes ? Tous les jurés, leurs codes, toutes les notes, sommes et commentaires de ce pitch seront supprimés de Supabase. Cette action est irréversible sans sauvegarde JSON.`))return;
 const typed=prompt(`Pour confirmer, saisis exactement : P${p+1}`);
 if(typed!==`P${p+1}`){alert('Réinitialisation annulée.');return}
 try{await tfRequest('/rest/v1/rpc/tfactory_v18_reset_jury_pitch',{method:'POST',body:JSON.stringify({p_pitch:p})},tfToken)}catch(err){alert('Impossible de réinitialiser les jurés : '+err.message);return}state.teams.forEach(t=>{if(Array.isArray(t.pitches))t.pitches[p]=null});
 if(Array.isArray(state.juryConfig))state.juryConfig[p]=null;
 juryRoster=juryRoster.filter(j=>j.pitch!==p);juryEntries=juryEntries.filter(e=>juryRoster.some(j=>j.id===e.juror_id));generatedCodes=generatedCodes.filter(x=>x.pitch!==p);persistCodes();
 juryPitch=-1;calculated=null;
 save();notify();
 await loadRoster();
 alert(`Pitch P${p+1} réinitialisé : jurés, codes et évaluations supprimés. Les autres pitchs sont conservés.`);
}
function renameTeam(){let name=document.getElementById('rename').value.trim();if(!name)return;state.teams[team].name=name;save();notify()}
function backup(){return `<div class="card"><h2>Sauvegarder avant et après chaque pitch</h2><p>Les données sont enregistrées dans Supabase. Exportez aussi une sauvegarde JSON après chaque session.</p><div class="actions"><button class="btn primary" onclick="exportJSON()">Télécharger une sauvegarde JSON</button><label class="btn" style="margin:0">Restaurer un fichier JSON<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this)"></label><button class="btn danger" onclick="resetAll()">Repartir des données historiques</button></div><div class="notice">Le Live consulte Supabase sur tous les appareils. Les résultats ne sont publiés que lorsque toutes les équipes du pitch sont validées.</div></div>`}
function exportJSON(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='T-Factory-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importJSON(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.teams)||x.teams.length<1||x.teams.some(t=>!Array.isArray(t.pitches)||t.pitches.length!==8))throw Error('Format incompatible');if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){state=x;save();notify()}}catch(e){alert('Fichier invalide : '+e.message)}}
function resetAll(){if(confirm('Supprimer les nouvelles saisies et restaurer les deux pitchs historiques ?')){state={teams:structuredClone(INITIAL)};save();notify()}}

window.addEventListener('storage',e=>{if(e.key===KEY){state=load();render()}});try{const bc=new BroadcastChannel(KEY);bc.onmessage=()=>{state=load();render()};window.notify=()=>bc.postMessage('updated')}catch{window.notify=()=>{}}const v6Style=document.createElement('style');v6Style.textContent='.pitchChoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pitchChoices .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:3px;min-height:68px}.pitchChoices .btn small{font-size:12px;line-height:1.2;font-weight:500} @media(min-width:850px){.pitchChoices{grid-template-columns:repeat(4,minmax(0,1fr))}}';document.head.appendChild(v6Style);

let juryRoster=[],juryEntries=[],generatedCodes=[];
const JURY_CODES_CACHE='tfactory_v27_codes';
function restoreCodes(){try{const x=JSON.parse(localStorage.getItem(JURY_CODES_CACHE)||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function persistCodes(){try{localStorage.setItem(JURY_CODES_CACHE,JSON.stringify(generatedCodes))}catch(e){console.warn('Conservation locale des codes indisponible',e)}}
generatedCodes=restoreCodes();
function juryAdmin(){return `<div class="card"><h2>1. Choisir le pitch</h2><div class="pitchChoices">${TITLES.map((t,i)=>`<button class="btn ${pitch===i?'active':''}" onclick="pitch=${i};render();loadRoster()"><b>P${i+1}</b><small>${esc(t)}</small></button>`).join('')}</div></div><div class="card"><h2>2. Préparer les jurés · P${pitch+1}</h2><p class="muted">Les codes générés restent affichés sur cet appareil tant qu’ils ne sont pas renouvelés. Pour remplacer un code, utilise « Régénérer le code » ; l’ancien code sera désactivé sans effacer les évaluations.</p><div class="formGrid"><div><label>Prénom</label><input id="newJurorName" placeholder="Prénom"></div><div><label>Catégorie</label><select id="newJurorCategory"><option value="pro">Professionnel</option><option value="ped">Pédagogique</option></select></div></div><div class="actions"><button class="btn primary" onclick="addJuror()">+ Ajouter ce juré et générer son code</button><button class="btn" onclick="loadRoster()">Actualiser les saisies</button></div><div id="newCodes" class="notice" ${generatedCodes.some(x=>x.pitch===pitch)?'':'hidden'}>${generatedCodes.filter(x=>x.pitch===pitch).map(x=>`<div>${esc(x.name)} · ${x.category==='pro'?'Pro':'Pédagogique'} : <strong>${esc(x.code)}</strong></div>`).join('')}<button class="btn" onclick="copyCodes()">Copier les nouveaux codes</button></div><div id="roster">${rosterHTML()}</div></div><div class="card"><h2>3. Calculer et publier</h2><p class="muted">Chaque juré évalue individuellement chaque équipe. Notes : 70 % professionnels et 30 % pédagogiques. Financement : calcul automatique à partir de la note thématique pondérée, arrondi à 100 €.</p><div id="juryProgress">${progressHTML()}</div><div class="actions"><button class="btn primary" onclick="publishJuryPitch()">Calculer et publier ce pitch</button><button class="btn" onclick="exportJSON()">Sauvegarde JSON</button><button class="btn danger" onclick="resetSelectedPitch()">Réinitialiser entièrement P${pitch+1}</button></div></div>`}
function rosterHTML(){let a=juryRoster.filter(x=>x.pitch===pitch);return a.length?`<p>${a.length} juré(s) inscrits :</p>${a.map(j=>`<div class="row" style="border-top:1px solid #304477;padding:10px 0"><button class="btn" style="padding:6px 10px;min-height:34px;font-size:13px;text-align:left" onclick="regenerateJurorCode('${j.id}')" title="Générer un nouveau code pour ce juré">${esc(j.name)} · ${j.category==='pro'?'Professionnel':'Pédagogique'} · Régénérer le code</button><span class="muted small">${juryEntries.filter(e=>e.juror_id===j.id).length} équipe(s) saisie(s)</span><button class="btn danger" style="padding:6px 10px;min-height:34px;font-size:13px" onclick="removeJuror('${j.id}')">Supprimer</button></div>`).join('')}`:'<p class="muted">Aucun juré pour ce pitch.</p>'}
function progressHTML(){let js=juryRoster.filter(x=>x.pitch===pitch),teams=eligible(pitch);if(!js.length)return '<p class="muted">Ajoute les jurés avant de publier.</p>';return teams.map(t=>{let i=state.teams.indexOf(t),count=js.filter(j=>juryEntries.some(e=>e.juror_id===j.id&&e.team_index===i)).length;return `<div class="row"><span>${esc(t.name)}</span><strong>${count}/${js.length}</strong></div>`}).join('')}
async function loadRoster(){try{const [j,e]=await Promise.all([tfRequest('/rest/v1/tfactory_v18_jurors?select=id,pitch,name,category&order=created_at.asc',{},tfToken),tfRequest('/rest/v1/tfactory_v18_jury_entries?select=juror_id,team_index,fond,forme,amount,comment',{},tfToken)]);juryRoster=j||[];juryEntries=e||[];generatedCodes=generatedCodes.filter(x=>juryRoster.some(j=>j.id===x.jurorId));persistCodes();if(view==='jurys')render()}catch(err){alert('Chargement des jurés impossible : '+err.message)}}
async function regenerateJurorCode(id){
 const j=juryRoster.find(x=>x.id===id);if(!j)return;
 if(!confirm(`Régénérer le code de ${j.name} ?\n\nL’ancien code cessera de fonctionner, mais ses notes et financements déjà saisis seront conservés.`))return;
 let code,done=false;
 for(let tries=0;tries<12;tries++){
  const digits=new Uint32Array(1);crypto.getRandomValues(digits);
  code=String(digits[0]%100000).padStart(5,'0');
  try{
   await tfRequest('/rest/v1/rpc/tfactory_v18_regenerate_juror_code',{method:'POST',body:JSON.stringify({p_juror_id:id,p_code:code})},tfToken);
   done=true;break;
  }catch(err){
   if(String(err.message).toLowerCase().includes('duplicate'))continue;
   alert('Renouvellement impossible : '+err.message+'\nVérifie que le SQL V24 a bien été exécuté dans Supabase.');return;
  }
 }
 if(!done){alert('Impossible de générer un code unique. Réessaie.');return}
 generatedCodes=generatedCodes.filter(x=>x.jurorId!==id && !(x.name===j.name&&x.category===j.category));
 generatedCodes.push({jurorId:id,pitch:j.pitch,name:j.name,category:j.category,code});persistCodes();
 render();
 alert(`Nouveau code de ${j.name} : ${code}\n\nL’ancien code est désactivé. Les évaluations existantes sont conservées.`);
}
async function removeJuror(id){
 const j=juryRoster.find(x=>x.id===id);if(!j)return;
 const count=juryEntries.filter(e=>e.juror_id===id).length;
 const wasPublished=eligible(j.pitch).some(t=>t.pitches[j.pitch]?.locked);
 const warning=`Supprimer ${j.name} (${j.category==='pro'?'professionnel':'pédagogique'}) du pitch P${j.pitch+1} ?\n\nSon code et ses ${count} évaluation(s) seront définitivement supprimés.`+(wasPublished?'\n\nATTENTION : les résultats publiés de ce pitch seront retirés du Live et devront être recalculés puis republiés.':'');
 if(!confirm(warning))return;
 try{
  await tfRequest('/rest/v1/rpc/tfactory_v18_delete_juror',{method:'POST',body:JSON.stringify({p_juror_id:id})},tfToken);
  generatedCodes=generatedCodes.filter(x=>x.jurorId!==id);persistCodes();
  if(wasPublished){state.teams.forEach(t=>{if(Array.isArray(t.pitches))t.pitches[j.pitch]=null});save();notify()}
  await loadRoster();
  alert('Juré supprimé, ainsi que son code et ses évaluations.');
 }catch(err){alert('Suppression impossible : '+err.message)}
}
async function addJuror(){let name=document.getElementById('newJurorName').value.trim(),category=document.getElementById('newJurorCategory').value;if(!name){alert('Indique un prénom.');return}if(juryEntries.some(e=>juryRoster.some(j=>j.id===e.juror_id&&j.pitch===pitch))){if(!confirm('Des évaluations ont déjà été saisies. Ajouter un juré exigera son évaluation pour toutes les équipes. Continuer ?'))return}let code,id;for(let tries=0;tries<12;tries++){let digits=new Uint32Array(1);crypto.getRandomValues(digits);code=String(digits[0]%100000).padStart(5,'0');try{id=await tfRequest('/rest/v1/rpc/tfactory_v18_add_juror',{method:'POST',body:JSON.stringify({p_pitch:pitch,p_name:name,p_category:category,p_code:code})},tfToken);break}catch(err){if(!String(err.message).includes('duplicate')){alert('Création impossible : '+err.message);return}}}if(!id){alert('Impossible de créer un code unique.');return}generatedCodes.push({jurorId:id,pitch,name,category,code});persistCodes();await loadRoster()}
function copyCodes(){navigator.clipboard.writeText(generatedCodes.filter(x=>x.pitch===pitch).map(x=>`${x.name} (${x.category==='pro'?'Pro':'Pédagogique'}) : ${x.code}`).join('\n')).then(()=>alert('Codes copiés')).catch(()=>alert('Copie indisponible sur ce navigateur.'))}
async function publishJuryPitch(){let js=juryRoster.filter(j=>j.pitch===pitch),pros=js.filter(j=>j.category==='pro'),peds=js.filter(j=>j.category==='ped');if(!pros.length||!peds.length){alert('Il faut au moins un juré professionnel et un juré pédagogique.');return}let changes=[];for(let t of eligible(pitch)){let i=state.teams.indexOf(t),items=js.map(j=>({j,e:juryEntries.find(e=>e.juror_id===j.id&&e.team_index===i)}));if(items.some(x=>!x.e)){alert('Saisies incomplètes pour '+t.name+'. Actualise les données.');return}let pro=items.filter(x=>x.j.category==='pro').map(x=>[+x.e.fond,+x.e.forme]),ped=items.filter(x=>x.j.category==='ped').map(x=>[+x.e.fond,+x.e.forme]);let avg=(a,k)=>a.reduce((s,r)=>s+r[k],0)/a.length;let scores=[avg(pro,0),avg(pro,1),avg(ped,0),avg(ped,1)];let juryAmounts=items.map(x=>({name:x.j.name,category:x.j.category,amount:autoFunding(+x.e.fond + +x.e.forme)}));let amount=Math.ceil((juryAmounts.reduce((sum,x)=>sum+x.amount,0)/juryAmounts.length-1e-9)/10)*10;changes.push({t,entry:{scores,proJurors:pro,pedJurors:ped,amount,locked:true,comment:items.map(x=>x.e.comment?x.j.name+' : '+x.e.comment:'').filter(Boolean).join('\n'),juryAmounts}})}if(!confirm(`Publier P${pitch+1} pour ${changes.length} équipe(s) ? Les évaluations individuelles seront alors verrouillées pour les jurés.`))return;changes.forEach(x=>x.t.pitches[pitch]=x.entry);save();notify();alert('Publication demandée. Vérifie le Live après confirmation de la sauvegarde Supabase.')}

function render(){if(!tfReady)return;document.getElementById('app').innerHTML=admin()}
function unlock(){document.getElementById('gate').hidden=true;document.getElementById('app').hidden=false;render()}
async function loadAdmin(){
 const rows=await tfRequest('/rest/v1/tfactory_v18_state?select=data,updated_at&id=eq.1',{},tfToken);
 if(!rows?.length||!Array.isArray(rows[0].data?.teams))throw Error('État T·Factory inaccessible : vérifie les droits administrateur.');
 state=rows[0].data;remoteStamp=rows[0].updated_at;tfReady=true;unlock();await loadRoster();
}
document.getElementById('accessForm').addEventListener('submit',async e=>{
 e.preventDefault();const error=document.getElementById('accessError');error.textContent='Connexion…';
 try{
 const auth=await tfRequest('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:document.getElementById('accessEmail').value.trim(),password:document.getElementById('accessCode').value})});
 if(!auth?.access_token)throw Error('Connexion refusée');tfToken=auth.access_token;
 sessionStorage.setItem('tfactory_v18_admin_token',tfToken);
 await loadAdmin();error.textContent='';
 }catch(err){error.textContent='Connexion impossible : vérifie ton e-mail, ton mot de passe et tes droits administrateur.';console.error(err)}
});
(async()=>{let token=sessionStorage.getItem('tfactory_v18_admin_token');if(!token)return;tfToken=token;try{await loadAdmin()}catch{sessionStorage.removeItem('tfactory_v18_admin_token');tfToken=null}})();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
