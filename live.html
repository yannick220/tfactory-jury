function livePitchView(){let lastPublished=last();if(lastPublished<0)return `<h1>En attente du premier pitch</h1>`;let p=rankingPitch===null?lastPublished:Math.min(rankingPitch,lastPublished);let defs=[['fond','Note de fond'],['forme','Note de forme'],['general','Note thématique'],['somme','Montant alloué'],['cumul','Montant cumulé'],['valorisation','Valorisation']];let val=(e,t)=>rankingMetric==='valorisation'?valuation(state.teams.indexOf(t),p):rankingMetric==='fond'?( .7*e.scores[0]+.3*e.scores[2])*10/9.2:rankingMetric==='forme'?( .7*e.scores[1]+.3*e.scores[3])*10/10.8:rankingMetric==='somme'?amountOf(e):rankingMetric==='cumul'?t.pitches.slice(0,p+1).reduce((a,x)=>a+(x?.locked?amountOf(x):0),0):score(e);let sorted=eligible(p).map(t=>({t,v:val(t.pitches[p],t)})).sort((a,b)=>b.v-a.v);return `<div class="liveTitle"><div><div class="eyebrow">RÉSULTATS PUBLIÉS · PITCH ${p+1} / 8</div><h1>${esc(TITLES[p])}</h1></div><div class="pitchStepper"><button class="btn" onclick="rankingPitch=${Math.max(0,p-1)};render()" ${p===0?'disabled':''} aria-label="Pitch précédent">‹</button><span>P${p+1}</span><button class="btn" onclick="rankingPitch=${Math.min(lastPublished,p+1)};render()" ${p===lastPublished?'disabled':''} aria-label="Pitch suivant">›</button></div></div><div class="rankingMetrics">${defs.map(([k,t])=>`<button class="btn ${rankingMetric===k?'active':''}" onclick="rankingMetric='${k}';render()">${t}</button>`).join('')}</div><div class="liveGrid" style="grid-template-columns:repeat(${sorted.length===4?2:sorted.length<=2?Math.max(1,sorted.length):3},minmax(0,1fr));grid-template-rows:repeat(${Math.ceil(sorted.length/(sorted.length===4?2:sorted.length<=2?Math.max(1,sorted.length):3))},minmax(0,1fr))">${sorted.map((x,i)=>pitchCard(x.t,i+1,p)).join('')}</div>`}

function drawChart(){let canvas=document.getElementById('fundChart');if(!canvas)return;let vp=document.getElementById('chartViewport');let dpr=window.devicePixelRatio||1;let w=Math.max(500,vp.clientWidth*8/zoom),h=Math.max(270,vp.clientHeight);canvas.style.width=w+'px';canvas.style.height=h+'px';canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);let c=canvas.getContext('2d');c.scale(dpr,dpr);let L=85,R=35,T=28,B=45;let vals=state.teams.map((t,i)=>t.pitches.map((e,p)=>(t.joinedAt??0)<=p&&available(p)?valuation(i,p):null));let numbers=vals.flat().filter(v=>v!==null&&Number.isFinite(v));let min=Math.min(0,...numbers),max=Math.max(1000,...numbers);if(max===min)max=min+1;let xx=p=>L+p*(w-L-R)/7,yy=v=>T+(max-v)*(h-T-B)/(max-min);c.font='15px Montserrat, sans-serif';c.textAlign='right';for(let j=0;j<=4;j++){let v=min+(max-min)*j/4,y=yy(v);c.strokeStyle='#334467';c.lineWidth=1;c.beginPath();c.moveTo(L,y);c.lineTo(w-R,y);c.stroke();c.fillStyle='#b9c6df';c.fillText(Math.round(v).toLocaleString('fr-FR')+' €',L-12,y+5)}c.strokeStyle='#f4f7ff';c.lineWidth=2.6;c.beginPath();c.moveTo(L,yy(0));c.lineTo(w-R,yy(0));c.stroke();c.fillStyle='#ffffff';c.textAlign='right';c.font='bold 15px Montserrat, sans-serif';c.fillText('0 €',L-12,yy(0)+5);c.font='15px Montserrat, sans-serif';c.textAlign='center';for(let p=0;p<8;p++){c.fillStyle='#f5f7ff';c.fillText('P'+(p+1),xx(p),h-13)}vals.forEach((arr,i)=>{if(hidden.has(i))return;c.strokeStyle=COLORS[i%COLORS.length];c.lineWidth=3;c.beginPath();let started=false;arr.forEach((v,p)=>{if(v===null)return;started?c.lineTo(xx(p),yy(v)):c.moveTo(xx(p),yy(v));started=true});c.stroke();arr.forEach((v,p)=>{if(v===null)return;c.beginPath();c.arc(xx(p),yy(v),5,0,Math.PI*2);c.fillStyle=COLORS[i%COLORS.length];c.fill()})})}
